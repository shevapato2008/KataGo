# Config for KataGo Analysis engine on RK3562 SBC (2GB RAM)
# Optimized for minimal memory usage with b18c384 model (~400MB)
#
# Memory budget:
#   System (Debian + desktop): ~300-500MB
#   b18c384 model + 1 thread:  ~450MB
#   KaTrain / other apps:      ~200MB
#   Total:                     ~950MB - 1.15GB (fits in 2GB)

# Logs------------------------------------------------------------------------------------

logDir = analysis_logs
# logToStderr = true
warnUnusedFields = false

# Analysis------------------------------------------------------------------------------------

reportAnalysisWinratesAs = BLACK

# Search limits-----------------------------------------------------------------------------------

# 200 visits is sufficient for casual play; slightly weaker but faster response
maxVisits = 200

# Search threads, batching--------------------------------------------------------------------------

# Single analysis thread + single search thread = minimal memory footprint
# On SBC, we only handle one query at a time from KaTrain
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 1

# Batch size of 1 since we only have 1 search thread
nnMaxBatchSize = 1

# NN Cache and Memory--------------------------------------------------------------------------

# 2^16 = 65536 entries (vs default 2^23 = 8M entries)
# Sufficient for casual play, saves hundreds of MB
nnCacheSizePowerOfTwo = 16

# 2^12 = 4096 mutex pool entries (vs default 2^17 = 131072)
nnMutexPoolSizePowerOfTwo = 12

# Randomize board orientation for neural net evals
nnRandomize = true

# Eigen-specific settings--------------------------------------
# These only apply when compiled with -DUSE_BACKEND=EIGEN

# Limit Eigen to 2 CPU threads to reduce memory and leave resources for the system
# RK3562 has 4 cores (4x A53), but we want headroom for KaTrain, YOLO, etc.
numEigenThreadsPerModel = 2

# OpenCL-specific settings--------------------------------------
# These only apply when compiled with -DUSE_BACKEND=OPENCL
# RK3562 has Mali-G52 GPU — weaker than RK3588's Mali-G610
# OpenCL may still be faster than Eigen for neural net inference

# openclDeviceToUse = 0
# openclUseFP16 = auto
